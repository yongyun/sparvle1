<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>

	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta http-equiv="x-ua-compatible" content="IE=edge">
	<meta name="author" content="SemiColonWeb">
	<meta name="description" content="Sparvle 會員登入頁面，提供會員中心與下載服務的入口。">

	<!-- Font Imports -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

	<!-- Core Style -->
	<link rel="stylesheet" href="style.css">

	<!-- Font Icons -->
	<link rel="stylesheet" href="css/font-icons.css">

	<!-- Custom CSS -->
	<link rel="stylesheet" href="css/custom.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Document Title
	============================================= -->
	<title>會員登入 | Sparvle</title>

</head>

<body class="stretched">

	<!-- Document Wrapper
	============================================= -->
	<div id="wrapper">

		<!-- Header
		============================================= -->
		<div data-include="header"></div>

		<!-- Page Title
		============================================= -->
		<section class="page-title bg-transparent">
			<div class="container">
				<div class="page-title-row">

					<div class="page-title-content">
						<h1>會員登入</h1>
						<span>Member Login</span>
					</div>

					<nav aria-label="breadcrumb">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a href="index.html">首頁</a></li>
							<li class="breadcrumb-item active" aria-current="page">登入</li>
						</ol>
					</nav>

				</div>
			</div>
		</section><!-- .page-title end -->

		<!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap">
				<div class="container">

					<div class="row justify-content-center">
						<div class="col-lg-6 col-md-8">
							<div class="card shadow-sm border-0">
								<div class="card-body p-5">
									<div class="heading-block border-bottom-0 mb-4">
										<h3>登入你的 Sparvle 會員帳號</h3>
										<span>進入會員中心管理資料並查看下載紀錄。</span>
									</div>

									<form id="login-form" action="#" method="post" class="mb-0">
										<div class="mb-3">
											<label for="login-email" class="form-label">Email</label>
											<input type="email" id="login-email" name="login-email" class="form-control" placeholder="you@example.com" required>
										</div>
										<div class="mb-3">
											<label for="login-password" class="form-label">密碼</label>
											<input type="password" id="login-password" name="login-password" class="form-control" placeholder="請輸入密碼" required>
										</div>

										<div class="d-flex justify-content-between align-items-center mb-4">
											<div class="form-check">
												<input class="form-check-input" type="checkbox" value="1" id="login-remember">
												<label class="form-check-label" for="login-remember">記住我</label>
											</div>
											<a href="#" class="text-muted">忘記密碼？</a>
										</div>

										<button class="button button-3d w-100" type="submit">登入</button>
									</form>

									<div class="line line-sm"></div>
									<div class="text-center">
										<small>還沒有帳號？<a href="#">立即註冊</a></small>
									</div>
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>
		</section><!-- #content end -->

		<!-- Footer
		============================================= -->
		<div data-include="footer"></div>

	</div><!-- #wrapper end -->

	<!-- Go To Top
	============================================= -->
	<div id="gotoTop" class="uil uil-angle-up"></div>

	<!-- JavaScripts
	============================================= -->
	<script src="js/layout.js"></script>
	<script src="js/plugins.min.js"></script>
	<script src="js/functions.bundle.js"></script>

</body>
</html>
